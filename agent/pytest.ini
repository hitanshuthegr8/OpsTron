[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto

# Integration tests are opt-in. Without this the default `pytest` run makes a
# real (billed, network-dependent, non-deterministic) Groq call, which is
# exactly what a default suite must not do.
addopts = -m "not integration"

# Integration tests hit real external services (Groq, Supabase, GitHub) and cost
# money and time, so they are excluded from the default run. Run them with:
#   pytest -m integration
markers =
    integration: requires live external services (Groq / Supabase / GitHub)

filterwarnings =
    ignore::DeprecationWarning
